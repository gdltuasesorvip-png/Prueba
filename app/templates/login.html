{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Iniciar sesión</h1>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Usuario <input name="username" autofocus required autocomplete="username"></label>
    <label>Clave <input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary">Entrar</button>
  </form>
</div>
{% endblock %}
